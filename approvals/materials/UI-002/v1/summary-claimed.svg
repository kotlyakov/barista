<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#171e21"/><text x="70" y="63.22" fill="#e7b66d" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">ПУТЬ БАРИСТЫ</text><text x="70" y="140.18" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700">Всё сохранено</text><text x="72" y="189.68" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="24">Итог смены сохранён. Можно спокойно закрыть игру.</text><rect x="70" y="260" width="1460" height="330" rx="20" fill="#242e30"/><text x="120" y="349.62" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="41" font-weight="700">До следующей смены</text><text x="120" y="420.6" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="30">Кофейня снова откроется после 08:00.</text><text x="120" y="487.96" fill="#8bc5a2" font-family="DejaVu Sans,sans-serif" font-size="28">Тренировка доступна сейчас и не меняет твой прогресс.</text><rect x="70" y="718" width="360" height="64" rx="16" fill="#e7b66d"/><text x="129.4375" y="757.68" fill="#171e21" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Потренироваться</text><rect x="1110" y="718" width="420" height="64" rx="16" fill="#242e30" stroke="#546361" stroke-width="2"/><text x="1194.9375" y="757.68" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">На главный экран</text></svg>