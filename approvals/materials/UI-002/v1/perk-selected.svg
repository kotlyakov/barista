<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#171e21"/><text x="70" y="63.22" fill="#e7b66d" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">ПУТЬ БАРИСТЫ</text><text x="70" y="140.18" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700">Всё готово к открытию</text><text x="72" y="189.68" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="24">Твой выбор сохранён. Он не меняется при перезапуске.</text><rect x="70" y="260" width="1460" height="330" rx="20" fill="#242e30"/><text x="120" y="345.26" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="700">Лёгкий помол</text><text x="120" y="415.42" fill="#8bc5a2" font-family="DejaVu Sans,sans-serif" font-size="31">На 2 тапа меньше при каждом помоле.</text><text x="120" y="476.32" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="26">Условие дня: спокойное утро.</text><text x="120" y="528.5" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="25">Постоянные покупки и усиление работают вместе.</text><rect x="1090" y="718" width="440" height="64" rx="16" fill="#e7b66d"/><text x="1215.609375" y="757.68" fill="#171e21" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Начать смену</text></svg>