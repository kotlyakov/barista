name: native-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  godot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.1' -o /tmp/godot.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Godot import and native tests
        env:
          GODOT: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        run: |
          "$GODOT" --headless --path game --editor --import
          python3 tools/check_native.py
      - name: Documentation consistency
        run: python3 tools/validate_project.py
      - name: Render native cafe states
        env:
          GODOT: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        run: |
          mkdir -p artifacts/screens
          xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/capture_screens.gd -- "$PWD/artifacts/screens"
      - name: Render actual Service v2 states
        env:
          GODOT: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/capture_v2_screens.gd -- "$PWD/artifacts/screens"
      - uses: actions/upload-artifact@v4
        with:
          name: native-cafe-screens
          path: artifacts/screens/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: native-source-assets
          path: |
            game/content/art/cafe/room.png
            approvals/materials/VISUAL-002/v9/assets/cafe-animation-room.png
          if-no-files-found: error
          retention-days: 1
