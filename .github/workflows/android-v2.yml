name: android-v2
concurrency:
  group: android-v2-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [task/TASK-043-free-service-ui]
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/android-v2.yml'
permissions:
  contents: read
jobs:
  unsigned-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_HOME: /tmp/barista-android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21'
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/4.5.1.stable" artifacts/ci
          curl --fail --location --retry 2 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o /tmp/godot.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl --fail --location --retry 2 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz' -o /tmp/templates.tpz
          echo '1998af37f1387684e2c211cdb483daf492fc64dc6b12096bddcdca25b6910c86  /tmp/templates.tpz' | sha256sum --check
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          unzip -p /tmp/templates.tpz templates/android_release.apk > "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"
          rm /tmp/templates.tpz
      - name: Install pinned Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o /tmp/android-cli.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli.zip' | sha256sum --check
          mkdir -p /tmp/android-cli "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/22.0"
          echo "$ANDROID_HOME/cmdline-tools/22.0/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --licenses > artifacts/ci/sdk-licenses.log 2>&1
          set -o pipefail
      - name: Configure Android SDK without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' > artifacts/ci/sdk-install.log 2>&1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          sdk=os.environ['ANDROID_HOME']
          settings=Path.home()/'.config/godot/editor_settings-4.5.tres'
          settings.parent.mkdir(parents=True,exist_ok=True)
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = '+json.dumps(sdk)+'\nexport/android/java_sdk_path = '+json.dumps(os.environ['JAVA_HOME'])+'\n')
          p=Path('game/export_presets.cfg')
          s=p.read_text()
          assert 'package/signed=true' in s
          p.write_text(s.replace('package/signed=true','package/signed=false'))
          Path('artifacts/ci/source.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'godot':'4.5.1','build_tools':'35.0.0','platform':35,'signed':False}))
          PY
          java -version 2> artifacts/ci/java-version.txt
          sdkmanager --version > artifacts/ci/sdkmanager-version.txt
          cp "$ANDROID_HOME/platform-tools/source.properties" artifacts/ci/platform-tools-version.txt
      - name: Test and export actual ARM64 APK
        env:
          GODOT: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path game --editor --import > artifacts/ci/import.log 2>&1
          python3 -m py_compile tools/android/smoke_v2.py
          python3 tools/check_native.py | tee artifacts/ci/tests.log
          "$GODOT" --headless --path game --export-debug Android "$PWD/artifacts/ci/Barista-0.4.2-unsigned.apk" > artifacts/ci/export.log 2>&1
          test -s artifacts/ci/Barista-0.4.2-unsigned.apk
          "$GODOT" --headless --path game --export-debug 'Android Emulator' "$PWD/artifacts/ci/Barista-0.4.2-emulator-unsigned.apk" > artifacts/ci/emulator-export.log 2>&1
          test -s artifacts/ci/Barista-0.4.2-emulator-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/ci/Barista-0.4.2-unsigned.apk > artifacts/ci/badging.txt
          mkdir -p artifacts/ci/signing-kit/build-tools/35.0.0/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/"{aapt,apksigner,zipalign} artifacts/ci/signing-kit/build-tools/35.0.0/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/ci/signing-kit/build-tools/35.0.0/lib/
          if [ -d "$ANDROID_HOME/build-tools/35.0.0/lib64" ]; then cp -a "$ANDROID_HOME/build-tools/35.0.0/lib64" artifacts/ci/signing-kit/build-tools/35.0.0/; fi
          find artifacts/ci -type f -name '*.keystore' -o -name '*.jks' | tee /tmp/unexpected-keys
          test ! -s /tmp/unexpected-keys
          sha256sum artifacts/ci/Barista-0.4.2-unsigned.apk > artifacts/ci/unsigned.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-unsigned-0.4.2
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-failure-logs
          path: artifacts/ci/*.log
          retention-days: 7

  android-smoke:
    needs: unsigned-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /tmp/barista-android-sdk
      BARISTA_EXPECTED_SOURCE_SHA: ${{ github.sha }}
      BARISTA_BUILD_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21'
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned-0.4.2
          path: artifacts/android-input
      - name: Install pinned SDK commands and temporary emulator signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-cli "$ANDROID_HOME/cmdline-tools" artifacts/android-runtime-v2
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o /tmp/android-cli.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli.zip' | sha256sum --check
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/22.0"
          echo "$ANDROID_HOME/cmdline-tools/22.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --licenses > artifacts/android-runtime-v2/licenses.log 2>&1
          set -o pipefail
          keytool -genkeypair -keystore /tmp/barista-emulator-test.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Ephemeral Emulator Test' -keyalg RSA -keysize 2048 -validity 2
          java -jar artifacts/android-input/signing-kit/build-tools/35.0.0/lib/apksigner.jar sign --ks /tmp/barista-emulator-test.keystore --ks-pass pass:android --out /tmp/barista-emulator-test.apk artifacts/android-input/Barista-0.4.2-emulator-unsigned.apk
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-build: 16740729
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            # Functional touch/lifecycle test on a software GPU; physical performance is TASK022.
            adb shell wm size 360x640
            adb shell wm density 160
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install -r /tmp/barista-emulator-test.apk
            python3 tools/android/smoke_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-v2-evidence
          path: artifacts/android-runtime-v2/
          if-no-files-found: error
          retention-days: 7
