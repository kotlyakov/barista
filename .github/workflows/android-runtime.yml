name: android-runtime
on:
  push:
    branches: [task/TASK-026-single-cafe-native]
    paths:
      - '.github/workflows/android-runtime.yml'
      - 'tools/android/**'
permissions:
  contents: read
  actions: read
jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANDROID_HOME: /tmp/barista-android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21'
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned-0.3.0
          path: artifacts/android-input
          run-id: 41024619007
          github-token: ${{ github.token }}
      - name: Install pinned SDK commands and temporary emulator signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-cli "$ANDROID_HOME/cmdline-tools" artifacts/android-runtime
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o /tmp/android-cli.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli.zip' | sha256sum --check
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/22.0"
          echo "$ANDROID_HOME/cmdline-tools/22.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --licenses > artifacts/android-runtime/licenses.log 2>&1
          set -o pipefail
          keytool -genkeypair -keystore /tmp/barista-emulator-test.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Ephemeral Emulator Test' -keyalg RSA -keysize 2048 -validity 2
          java -jar artifacts/android-input/signing-kit/build-tools/35.0.0/lib/apksigner.jar sign --ks /tmp/barista-emulator-test.keystore --ks-pass pass:android --out /tmp/barista-emulator-test.apk artifacts/android-input/Barista-0.3.0-emulator-unsigned.apk
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-build: 16740729
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r /tmp/barista-emulator-test.apk
            python3 tools/android/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: artifacts/android-runtime/
          if-no-files-found: error
          retention-days: 7
