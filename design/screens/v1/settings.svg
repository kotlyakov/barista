<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#171e21"/><text x="70" y="63.22" fill="#e7b66d" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">ПУТЬ БАРИСТЫ</text><text x="70" y="140.18" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700">Сделаем паузу</text><text x="72" y="189.68" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="24">Смена и заказ ждут тебя. Таймер остановлен.</text><rect x="70" y="230" width="880" height="440" rx="20" fill="#242e30"/><text x="110" y="294.14" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="27">Общая громкость</text><rect x="480" y="286" width="390" height="12" rx="6" fill="#101719"/><rect x="480" y="286" width="292" height="12" rx="6" fill="#e7b66d"/><text x="110" y="394.14" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="27">Музыка</text><rect x="480" y="386" width="390" height="12" rx="6" fill="#101719"/><rect x="480" y="386" width="175" height="12" rx="6" fill="#e7b66d"/><text x="110" y="494.14" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="27">Эффекты</text><rect x="480" y="486" width="390" height="12" rx="6" fill="#101719"/><rect x="480" y="486" width="312" height="12" rx="6" fill="#e7b66d"/><text x="110" y="594.14" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="27">Вибрация</text><rect x="750" y="565" width="120" height="45" rx="22" fill="#8bc5a2"/><rect x="818" y="570" width="37" height="35" rx="17" fill="#f5ead8"/><rect x="980" y="230" width="550" height="440" rx="20" fill="#242e30"/><text x="1020" y="302.24" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700">В своём темпе</text><text x="1020" y="363.68" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="24">Обучение можно повторить.</text><text x="1020" y="406.04" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-s