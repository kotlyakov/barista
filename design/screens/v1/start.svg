<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#171e21"/><text x="70" y="63.22" fill="#e7b66d" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">ПУТЬ БАРИСТЫ</text><text x="70" y="140.18" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700">Хороший кофе начинается с тебя</text><text x="72" y="189.68" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="24">Твоя кофейня. Твой ритм. Каждый гость запоминает заботу.</text><rect x="70" y="250" width="890" height="370" rx="20" fill="#242e30"/><text x="115" y="326.52" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700">Новая смена</text><text x="115" y="388.78" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="29">8 минут за стойкой</text><text x="115" y="440.14" fill="#8bc5a2" font-family="DejaVu Sans,sans-serif" font-size="27">Сегодня: спокойное утро</text><text x="115" y="490.5" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="25">Гости готовы подождать чуть дольше.</text><rect x="115" y="530" width="360" height="64" rx="16" fill="#e7b66d"/><text x="166.734375" y="569.68" fill="#171e21" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Открыть кофейню</text><rect x="1000" y="250" width="530" height="370" rx="20" fill="#242e30"/><text x="1040" y="323.24" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700">Сначала попробуем?</text><text x="1040" y="390.5" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="25">Один учебный капучино.</text><text x="1040" y="433.86" fill="#acb8b4" font-family="DejaVu Sans,sans-serif" font-size="23">Без таймера и потери монет.</text><rect x="1040" y="530" width="440" height="64" rx="16" fill="#242e30" stroke="#546361" stroke-width="2"/><text x="1123.59375" y="569.68" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Научиться готовить</text><rect x="70" y="720" width="260" height="64" rx="16" fill="#242e30" stroke="#546361" stroke-width="2"/><text x="125.984375" y="759.68" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Настройки</text><rect x="360" y="720" width="280" height="64" rx="16" fill="#242e30" stroke="#546361" stroke-width="2"/><text x="417.703125" y="759.68" fill="#f5ead8" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700">Тренировка</text><text x="1050" y="770.6" fill="#e7b66d" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700">Монеты  ·  1 240</text></svg>